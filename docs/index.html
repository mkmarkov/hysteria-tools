<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hysteria Raid Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<!-- Wowhead tooltips: hovering a buff icon (a link to Wowhead) shows the in-game spell tooltip -->
<script>const whTooltips = {colorLinks: false, iconizeLinks: false, renameLinks: false};</script>
<script src="https://wow.zamimg.com/js/tooltips.js"></script>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b303b; --text:#e6e6e6; --muted:#8b93a3;
  --gold:#e8c46a; --danger:#e5605b; --ok:#5fbf77; --accent:#6aa6ff;
  --tank:#7aa7ff; --heal:#6fd38a; --dps:#ef7b6b;
  --Warrior:#C69B6D; --Warlock:#8788EE; --Mage:#3FC7EB; --Priest:#FFFFFF; --Druid:#FF7C0A;
  --Shaman:#0070DD; --Paladin:#F48CBA; --Rogue:#FFF468; --Hunter:#AAD372; --Unknown:#a3a9b5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button:hover{border-color:#4a5262}
button.primary{background:#2a3b5c;border-color:#3d5687;white-space:nowrap}
button.danger{color:var(--danger)}
button.icon{padding:2px 6px;line-height:1;background:transparent;border-color:transparent;color:var(--muted)}
button.icon:hover{color:var(--text);border-color:var(--line)}
select,input[type=text],input[type=password],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:#12151b;position:sticky;top:0;z-index:5}
h1{font-family:Cinzel,serif;font-size:20px;margin:0;color:var(--gold);letter-spacing:.5px}
.spacer{flex:1}
.status{color:var(--muted);font-size:12px}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:5px}
.status.offline .dot{background:var(--danger)}
.mode{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.mode.edit{color:var(--ok);border-color:#2f6b40}
main{display:grid;grid-template-columns:340px repeat(3,minmax(280px,1fr));gap:12px;padding:12px 16px;height:calc(100vh - 56px)}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.colhead{padding:10px 12px;border-bottom:1px solid var(--line)}
.colbody{overflow:auto;padding:6px 8px 12px;flex:1}
.row{display:flex;align-items:center;gap:6px}
.ttl{font-family:Cinzel,serif;font-weight:700;font-size:16px}
.small{font-size:12px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.filters input[type=text]{flex:1;min-width:120px}
.chipbtn{font-size:12px;padding:3px 8px;border-radius:999px}
.chipbtn.on{background:#2a3b5c;border-color:#3d5687}
.clshead{margin:10px 4px 4px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px;display:flex;gap:6px;align-items:center}
.ch{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;border:1px solid transparent}
.ch:hover{background:var(--panel2);border-color:var(--line)}
.ch[draggable=true]{cursor:grab}
.ch.placed{opacity:.45}
.name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.specs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.badge{font-size:10px;padding:1px 5px;border-radius:4px;border:1px solid var(--line);color:var(--muted);flex:none}
.badge.alt{color:#c9a6ff;border-color:#4b3a6b}
.badge.where{color:var(--gold);border-color:#5b4b23}
.badge.warn{color:#ffb35c;border-color:#6b4a23}
.ico{width:18px;height:18px;border-radius:3px;flex:none;border:1px solid #000;box-shadow:0 0 0 1px #3a3f4b}
.ico.cls{width:20px;height:20px;border-radius:50%}
.specicons{display:flex;gap:2px;flex:none}
.clshead .ico.cls{width:18px;height:18px}
.role{width:8px;height:8px;border-radius:2px;flex:none}
.role.tank{background:var(--tank)}.role.heal{background:var(--heal)}.role.dps{background:var(--dps)}.role.unknown{background:var(--Unknown)}
.quick{display:flex;gap:2px;flex:none}
.quick button{padding:1px 6px;font-size:11px}
.counts{display:flex;gap:10px;font-size:12px;margin-top:6px;flex-wrap:wrap}
.counts b{font-weight:700}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:8px;background:var(--panel2)}
.clsgrid{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11px;color:var(--muted)}
.clsgrid span b{font-weight:700}
.leader{margin-top:6px;font-size:13px}
.leader .crown{color:var(--gold)}
.slot{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;border:1px solid transparent}
.slot:hover{background:var(--panel2);border-color:var(--line)}
.slot.isleader{background:#2a2414;border-color:#5b4b23}
.slot select{padding:1px 4px;font-size:12px;max-width:120px}
.slot select.specsel{max-width:130px}
.slot .crownbtn{color:#555b66}
.slot .crownbtn.on{color:var(--gold)}
.rolehead{margin:10px 4px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.buffs{margin-top:8px;font-size:12px}
.buffs summary{cursor:pointer;color:var(--muted)}
.buffs summary:hover{color:var(--text)}
.buffcap{margin:6px 0 3px}
.buffrow{display:flex;flex-wrap:wrap;gap:3px}
.buff{position:relative;display:inline-flex}
.buffinfo{margin-top:6px;min-height:16px}
.buff .ico{width:22px;height:22px}
.buff.missing .ico{filter:grayscale(1);opacity:.3}
.buff i{position:absolute;right:-3px;bottom:-3px;font-style:normal;font-size:9px;font-weight:700;background:#000;border-radius:3px;padding:0 2px;line-height:12px}
.benchzone{margin-top:14px;border:1px dashed var(--line);border-radius:8px;padding:2px 4px 6px;min-height:60px}
.benchzone.drop{border-color:var(--accent);background:rgba(106,166,255,.06)}
.benchhint{text-align:center;padding:10px 0}
.slot.benched .name{opacity:.75}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:13px}
.ro .editonly{display:none!important}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:0;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{padding:16px}
.dlg h2{margin:0 0 12px;font-family:Cinzel,serif;font-size:18px;color:var(--gold)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.charrow{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;background:var(--panel2)}
.spectoggles{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.spectoggles button{font-size:12px;padding:3px 8px}
.spectoggles button.on{background:#2a3b5c;border-color:#3d5687}
.dlgfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#2b1e1e;border:1px solid #6b2f2f;color:#ffd0cc;padding:8px 14px;border-radius:8px;display:none;z-index:50;max-width:90vw}
#toast.info{background:#1e2b22;border-color:#2f6b40;color:#d4f5dc}
@media (max-width:1300px){main{grid-template-columns:320px 1fr 1fr;height:auto}.col{max-height:80vh}}
@media (max-width:900px){main{grid-template-columns:1fr;padding:12px 16px}.col{max-height:none}.colbody{max-height:70vh}}
</style>
</head>
<body>
<header>
  <h1>Hysteria Forever · Raid Roster</h1>
  <span id="status" class="status"><span class="dot"></span><span id="statustxt">Loading…</span></span>
</header>
<main id="main">
  <section class="col" id="bench" data-drop="bench">
    <div class="colhead">
      <div class="row"><span class="ttl">Players</span><span id="benchCount" class="small"></span><span class="spacer"></span><button id="addPlayerBtn" class="primary">+ Add player</button></div>
      <div class="filters">
        <input type="text" id="search" placeholder="Search name…">
        <select id="clsFilter"><option value="">All classes</option></select>
      </div>
      <div class="filters">
        <button class="chipbtn on" data-kind="all">All</button>
        <button class="chipbtn" data-kind="main">Mains</button>
        <button class="chipbtn" data-kind="alt">Alts</button>
        <span class="spacer"></span>
        <label class="small"><input type="checkbox" id="hidePlaced" checked> Hide placed</label>
      </div>
    </div>
    <div class="colbody" id="benchList"></div>
  </section>
</main>

<dialog id="playerDlg">
  <form method="dialog" id="playerForm">
    <div class="dlg">
      <h2 id="playerDlgTitle">Player</h2>
      <div class="field"><label for="pName">Name</label><input type="text" id="pName" maxlength="40" required></div>
      <div class="field"><label for="pNote">Note (optional)</label><input type="text" id="pNote" maxlength="200" placeholder="e.g. officer, raid times, gear notes"></div>
      <div class="field"><label>Classes &amp; specs <span class="small">(first selected spec = default)</span></label><div id="pChars"></div>
        <button type="button" id="addCharBtn">+ Add class</button></div>
    </div>
    <div class="dlgfoot">
      <button type="button" id="deletePlayerBtn" class="danger">Delete player</button>
      <span class="spacer"></span>
      <button type="button" id="cancelPlayerBtn">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="confirmDlg">
  <form method="dialog">
    <div class="dlg"><h2 id="confirmTitle"></h2><p id="confirmMsg" style="margin:0"></p></div>
    <div class="dlgfoot"><button value="cancel" autofocus>Cancel</button><button value="ok" id="confirmOk" class="danger"></button></div>
  </form>
</dialog>

<div id="toast"></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
import { applyOp, OpError, CLASSES } from "./ops.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ROLE = {
  Warrior:{Protection:"tank"}, Paladin:{Protection:"tank",Holy:"heal"}, Druid:{"Feral (Tank)":"tank",Restoration:"heal"},
  Priest:{Holy:"heal",Discipline:"heal"}, Shaman:{Restoration:"heal"}
};
const roleOf = (cls, spec) => cls === "Unknown" ? "unknown" : (ROLE[cls] && ROLE[cls][spec]) || "dps";
const ROLES = ["tank", "heal", "dps", "unknown"];
const ROLE_LABEL = {tank:"Tanks", heal:"Healers", dps:"DPS", unknown:"Class unknown"};
// "Unknown" is the "?" placeholder class for players whose class isn't known yet
const clsLabel = cls => cls === "Unknown" ? "?" : cls;
const specLabel = sp => sp === "Unknown" ? "?" : sp;
const SHORT = {"Protection":"Prot","Arms":"Arms","Fury":"Fury","Affliction":"Affli","Destruction":"Destro","Demonology":"Demo",
  "Arcane":"Arcane","Fire":"Fire","Frost":"Frost","Shadow":"Shadow","Holy":"Holy","Discipline":"Disc","Feral (Tank)":"Bear",
  "Feral (DPS)":"Cat","Balance":"Boomkin","Restoration":"Resto","Elemental":"Ele","Enhancement":"Enh","Retribution":"Ret",
  "Combat":"Combat","Assassination":"Assa","Subtlety":"Sub","Marksmanship":"MM","Beast Mastery":"BM","Survival":"Surv","Unknown":"?"};

// Icons are hot-linked from Wowhead's image CDN (same art as in-game); a missing icon just hides itself.
const ICON_URL = n => `https://wow.zamimg.com/images/wow/icons/medium/${n}.jpg`;
const SPEC_ICON = {
  Warrior:{Protection:"ability_warrior_defensivestance", Arms:"ability_warrior_savageblow", Fury:"ability_warrior_innerrage"},
  Warlock:{Affliction:"spell_shadow_deathcoil", Destruction:"spell_shadow_rainoffire", Demonology:"spell_shadow_metamorphosis"},
  Mage:{Arcane:"spell_holy_magicalsentry", Fire:"spell_fire_firebolt02", Frost:"spell_frost_frostbolt02"},
  Priest:{Shadow:"spell_shadow_shadowwordpain", Holy:"spell_holy_holybolt", Discipline:"spell_holy_wordfortitude"},
  Druid:{"Feral (Tank)":"ability_racial_bearform", "Feral (DPS)":"ability_druid_catform", Balance:"spell_nature_starfall", Restoration:"spell_nature_healingtouch"},
  Shaman:{Elemental:"spell_nature_lightning", Enhancement:"spell_nature_lightningshield", Restoration:"spell_nature_magicimmunity"},
  Paladin:{Protection:"spell_holy_devotionaura", Retribution:"spell_holy_auraoflight", Holy:"spell_holy_holybolt"},
  Rogue:{Combat:"ability_backstab", Assassination:"ability_rogue_eviscerate", Subtlety:"ability_stealth"},
  Hunter:{Marksmanship:"ability_marksmanship", "Beast Mastery":"ability_hunter_beasttaming", Survival:"ability_hunter_swiftstrike"},
  Unknown:{Unknown:"inv_misc_questionmark"},
};
const icon = (name, title, cls = "") => el("img", {class:"ico " + cls, src:ICON_URL(name), alt:"", title, loading:"lazy",
  referrerpolicy:"no-referrer", onerror: e => e.target.style.display = "none"});
const classIcon = cls => icon(cls === "Unknown" ? "inv_misc_questionmark" : "classicon_" + cls.toLowerCase(), cls === "Unknown" ? "Class unknown" : cls, "cls");
const specIcon = (cls, spec) => SPEC_ICON[cls] && SPEC_ICON[cls][spec] ? icon(SPEC_ICON[cls][spec], `${spec} ${cls}`) : null;

let S = null, VERSION = null, pendingRender = false;
let filt = {q:"", cls:"", kind:"all", hidePlaced:true};

const $ = s => document.querySelector(s);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) {
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
};

function toast(msg, info) {
  const t = $("#toast"); t.textContent = msg; t.className = info ? "info" : ""; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3500);
}

// ---------- Firestore sync ----------
// The whole roster lives in one Firestore document (rosters/main). Every change is applied by
// applyOp() inside a transaction, so simultaneous edits never overwrite each other; onSnapshot
// pushes each change to every open page instantly. The previous 50 versions are kept in
// rosters/main/backups/{0..49}.
const BACKUPS = 50;
let db = null, ROSTER = null;
function startSync() {
  if (!firebaseConfig || !firebaseConfig.projectId) {
    $("#statustxt").textContent = "Not configured – fill in firebase-config.js";
    $("#status").classList.add("offline");
    return;
  }
  db = initializeFirestore(initializeApp(firebaseConfig), {ignoreUndefinedProperties: true});
  ROSTER = doc(db, "rosters", "main");
  onSnapshot(ROSTER, {includeMetadataChanges: true}, snap => {
    if (!snap.exists()) {
      // Only seed when the server (not the local cache) says the roster doesn't exist yet
      if (!snap.metadata.fromCache) seedIfEmpty();
      return;
    }
    const d = snap.data();
    if (d.version !== VERSION || !S) accept(d);
    setOnline(!snap.metadata.fromCache);
  }, err => { setOnline(false); toast("Live sync failed: " + err.message); });
}
async function seedIfEmpty() {
  try {
    const seed = await (await fetch("seed.json", {cache:"no-store"})).json();
    await runTransaction(db, async tx => {
      if ((await tx.get(ROSTER)).exists()) return;
      tx.set(ROSTER, {version: 1, state: seed.state, updatedAt: serverTimestamp()});
    });
  } catch (e) { toast("Could not create the roster: " + e.message); }
}
// Replace the whole roster (maintenance: importing a snapshot). Old version goes to backups.
async function importState(state) {
  await runTransaction(db, async tx => {
    const cur = (await tx.get(ROSTER)).data();
    tx.set(ROSTER, {version: cur.version + 1, state, updatedAt: serverTimestamp()});
    tx.set(doc(db, "rosters", "main", "backups", String(cur.version % BACKUPS)), {version: cur.version, state: cur.state, savedAt: serverTimestamp()});
  });
}
window.rosterAdmin = {importState};
function accept(d) {
  S = d.state; VERSION = d.version;
  requestRender();
}
function setOnline(ok) {
  $("#status").classList.toggle("offline", !ok);
  $("#statustxt").textContent = ok ? `Live · v${VERSION ?? "–"}` : "Offline – reconnecting…";
}
async function op(body) {
  if (!ROSTER) { toast("Not connected"); return false; }
  try {
    await runTransaction(db, async tx => {
      const snap = await tx.get(ROSTER);
      if (!snap.exists()) throw new OpError("The roster hasn't loaded yet");
      const cur = snap.data();
      const st = structuredClone(cur.state);
      applyOp(st, body);
      tx.set(ROSTER, {version: cur.version + 1, state: st, updatedAt: serverTimestamp()});
      tx.set(doc(db, "rosters", "main", "backups", String(cur.version % BACKUPS)), {version: cur.version, state: cur.state, savedAt: serverTimestamp()});
    });
    return true;
  } catch (e) {
    toast(e instanceof OpError ? e.message : "Could not save: " + (e.message || e));
    return false;
  }
}
const canEdit = () => true; // open editing: anyone with the link can change the roster

// ---------- lookups ----------
const player = pid => S.players.find(p => p.id === pid);
const charOf = (p, cid) => p && p.chars.find(c => c.id === cid);
function placement() {
  const m = new Map();
  for (const g of S.groups) for (const s of g.slots) m.set(s.pid + "|" + s.cid, {g, s});
  return m;
}

// ---------- render ----------
function requestRender() {
  const a = document.activeElement;
  if (a && a.tagName === "SELECT" && a.closest("main")) { pendingRender = true; return; }
  if (document.querySelector("dialog[open]")) { pendingRender = true; return; }
  pendingRender = false; render();
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) requestRender(); }, 0));

function render() {
  if (!S) return;
  renderClassFilter();
  renderBench();
  renderGroups();
}

function renderClassFilter() {
  const sel = $("#clsFilter");
  if (sel.options.length > 1) return;
  for (const c of Object.keys(CLASSES)) sel.append(el("option", {value:c, style:`color:var(--${c})`}, c === "Unknown" ? "? (class unknown)" : c));
}

function dragData(e, obj) { e.dataTransfer.setData("text/plain", JSON.stringify(obj)); e.dataTransfer.effectAllowed = "move"; }

function renderBench() {
  const list = $("#benchList"), top = list.scrollTop; list.replaceChildren();
  requestAnimationFrame(() => list.scrollTop = top);
  const pl = placement(); const q = filt.q.toLowerCase();
  let shown = 0, total = 0;
  for (const cls of Object.keys(CLASSES)) {
    if (filt.cls && filt.cls !== cls) continue;
    const rows = [];
    for (const p of S.players) for (const c of p.chars) {
      if (c.cls !== cls) continue;
      total++;
      if (filt.kind !== "all" && c.kind !== filt.kind) continue;
      if (q && !p.name.toLowerCase().includes(q)) continue;
      const where = pl.get(p.id + "|" + c.id);
      if (where && filt.hidePlaced) continue;
      rows.push({p, c, where});
    }
    if (!rows.length) continue;
    rows.sort((a,b) => (a.c.kind === b.c.kind ? 0 : a.c.kind === "main" ? -1 : 1) || a.p.name.localeCompare(b.p.name));
    shown += rows.length;
    list.append(el("div", {class:"clshead", style:`color:var(--${cls})`}, classIcon(cls), cls === "Unknown" ? "? Class unknown" : cls, el("span", {class:"small"}, String(rows.length))));
    for (const {p, c, where} of rows) {
      const role = roleOf(c.cls, c.specs[0]);
      const others = p.chars.filter(x => x.id !== c.id).map(x => x.cls);
      const item = el("div", {class:"ch" + (where ? " placed" : ""), draggable: canEdit() && !where ? "true" : false,
          title: (p.note ? p.note + "\n" : "") + (others.length ? "Also plays: " + others.join(", ") : ""),
          ondragstart: e => dragData(e, {t:"char", pid:p.id, cid:c.id})},
        el("span", {class:"role " + role, title: ROLE_LABEL[role]}),
        classIcon(c.cls),
        el("span", {class:"name", style:`color:var(--${c.cls})`}, p.name),
        c.kind === "alt" ? el("span", {class:"badge alt"}, "alt") : null,
        el("span", {class:"specicons"}, c.specs.map(s => specIcon(c.cls, s))),
        el("span", {class:"specs"}, c.specs.map(s => SHORT[s] || s).join(" / ")),
        where ? el("span", {class:"badge where"}, where.g.name) : null,
        !where ? el("span", {class:"quick editonly"}, S.groups.map((g, i) =>
          el("button", {title:"Add to " + g.name, onclick: () => op({op:"assign", pid:p.id, cid:c.id, gid:g.id})}, String(i + 1)))) : null,
        el("button", {class:"icon editonly", title:"Edit player", onclick: () => openPlayer(p)}, "✎"));
      list.append(item);
    }
  }
  if (!shown) list.append(el("div", {class:"empty"}, total ? "No characters match these filters." : "No players yet."));
  $("#benchCount").textContent = `${S.players.length} players · ${shown} shown`;
}

function renderGroups() {
  const main = $("#main"), scroll = {};
  main.querySelectorAll(".col.grp").forEach(n => { scroll[n.dataset.drop] = n.querySelector(".colbody").scrollTop; n.remove(); });
  for (const g of S.groups) {
    const col = renderGroup(g);
    main.append(col);
    col.querySelector(".colbody").scrollTop = scroll[g.id] || 0;
  }
}

// Classic (level 60) raid buffs and debuffs and who provides them. "Class" = any spec of that class,
// "Class:Spec" = needs that talent spec (judged by the spec chosen for the raid slot).
// id = Classic spell id (max rank) for the Wowhead tooltip shown on hover.
const BUFFS = [
  {n:"Battle Shout", id:25289, i:"ability_warrior_battleshout", by:["Warrior"]},

  {n:"Shadow Protection", id:10958, i:"spell_shadow_antishadow", by:["Priest"]},
  {n:"Arcane Intellect", id:10157, i:"spell_holy_magicalsentry", by:["Mage"]},
  {n:"Mark of the Wild", id:9885, i:"spell_nature_regeneration", by:["Druid"]},
  {n:"Leader of the Pack", id:17007, i:"spell_nature_unyeildingstamina", by:["Druid:Feral (Tank)", "Druid:Feral (DPS)"]},

  {n:"Trueshot Aura", id:20906, i:"ability_trueshot", by:["Hunter:Marksmanship"]},
  {n:"Blessing of Kings", id:20217, i:"spell_magic_magearmor", by:["Paladin:Protection"]},
  {n:"Blessing of Might", id:25291, i:"spell_holy_fistofjustice", by:["Paladin"]},
  {n:"Blessing of Wisdom", id:25290, i:"spell_holy_sealofwisdom", by:["Paladin"]},
  {n:"Blessing of Salvation", id:1038, i:"spell_holy_sealofsalvation", by:["Paladin"]},
  {n:"Sanctity Aura", id:20218, i:"spell_holy_mindvision", by:["Paladin:Retribution"]},
  {n:"Windfury Totem", id:10614, i:"spell_nature_windfury", by:["Shaman"]},
  {n:"Strength of Earth Totem", id:25361, i:"spell_nature_earthbindtotem", by:["Shaman"]},
  {n:"Grace of Air Totem", id:25359, i:"spell_nature_invisibilitytotem", by:["Shaman"]},
  {n:"Mana Spring Totem", id:10497, i:"spell_nature_manaregentotem", by:["Shaman"]},
  {n:"Mana Tide Totem", id:17359, i:"spell_frost_summonwaterelemental", by:["Shaman:Restoration"]},
  {n:"Blood Pact", id:11767, i:"spell_shadow_bloodboil", by:["Warlock"]},
  {n:"Healthstone", id:11730, i:"inv_stone_04", by:["Warlock"]},
  {n:"Soulstone", id:20765, i:"spell_shadow_soulgem", by:["Warlock"]},
];
const DEBUFFS = [
  {n:"Sunder Armor", id:11597, i:"ability_warrior_sunder", by:["Warrior"]},
  {n:"Expose Armor", id:11198, i:"ability_warrior_riposte", by:["Rogue"]},
  {n:"Faerie Fire", id:9907, i:"spell_nature_faeriefire", by:["Druid"]},
  {n:"Curse of Recklessness", id:11717, i:"spell_shadow_unholystrength", by:["Warlock"]},
  {n:"Curse of the Elements", id:11722, i:"spell_shadow_chilltouch", by:["Warlock"]},
  {n:"Curse of Shadow", id:17937, i:"spell_shadow_curseofachimonde", by:["Warlock"]},
  {n:"Improved Shadow Bolt", id:17800, i:"spell_shadow_shadowbolt", by:["Warlock:Destruction"]},
  {n:"Shadow Weaving", id:15334, i:"spell_shadow_blackplague", by:["Priest:Shadow"]},
  {n:"Fire Vulnerability (Imp. Scorch)", id:22959, i:"spell_fire_soulburn", by:["Mage:Fire"]},
  {n:"Winter's Chill", id:12579, i:"spell_frost_chillingblast", by:["Mage:Frost"]},
  {n:"Judgement of Wisdom", id:20355, i:"spell_holy_righteousnessaura", by:["Paladin"]},
  {n:"Hunter's Mark", id:14325, i:"ability_hunter_snipershot", by:["Hunter"]},
  {n:"Demoralizing Shout", id:11556, i:"ability_warrior_warcry", by:["Warrior"]},
  {n:"Thunder Clap", id:11581, i:"spell_nature_thunderclap", by:["Warrior"]},
];
const provides = (b, x) => b.by.some(k => k === x.c.cls || k === x.c.cls + ":" + x.s.spec);
const providerText = by => by.map(k => k.replace(":", " – ")).join(" or ");
const buffsOpen = {}; // per group: is the buff list expanded (kept across re-renders)
const BUFF_HINT = "Hover an icon for its tooltip and who provides it";

function renderBuffs(g, active) {
  const info = el("div", {class:"small buffinfo"}, BUFF_HINT);
  const row = list => el("div", {class:"buffrow"}, list.map(b => {
    const who = active.filter(x => provides(b, x)).map(x => x.p.name);
    const line = who.length ? `${b.n} — from ${who.join(", ")}` : `${b.n} — missing, needs ${providerText(b.by)}`;
    // Wowhead's tooltip script (loaded in <head>) shows the in-game tooltip for these links
    return el("a", {class:"buff" + (who.length ? "" : " missing"), href:`https://www.wowhead.com/classic/spell=${b.id}`,
        "data-wowhead":`spell=${b.id}&domain=classic`, target:"_blank", rel:"noopener",
        onmouseenter: () => info.textContent = line, onmouseleave: () => info.textContent = BUFF_HINT},
      icon(b.i, ""), who.length > 1 ? el("i", {}, String(who.length)) : null);
  }));
  const have = list => list.filter(b => active.some(x => provides(b, x))).length;
  const det = el("details", {class:"buffs", open: !!buffsOpen[g.id]},
    el("summary", {}, `Buffs ${have(BUFFS)}/${BUFFS.length} · Debuffs ${have(DEBUFFS)}/${DEBUFFS.length}`,
      el("span", {class:"small"}, " (bench not counted)")),
    el("div", {class:"small buffcap"}, "Buffs"), row(BUFFS),
    el("div", {class:"small buffcap"}, "Debuffs"), row(DEBUFFS),
    info);
  det.addEventListener("toggle", () => buffsOpen[g.id] = det.open);
  return det;
}

function renderGroup(g) {
  const all = g.slots.map(s => { const p = player(s.pid); return {s, p, c: charOf(p, s.cid)}; }).filter(x => x.p && x.c);
  const active = all.filter(x => !x.s.bench), benched = all.filter(x => x.s.bench);
  const counts = {tank:0, heal:0, dps:0, unknown:0}, byCls = {};
  const perPlayer = {};
  for (const x of active) {
    counts[roleOf(x.c.cls, x.s.spec)]++;
    byCls[x.c.cls] = (byCls[x.c.cls] || 0) + 1;
  }
  for (const x of all) perPlayer[x.p.id] = (perPlayer[x.p.id] || 0) + 1;
  const leader = g.leader && player(g.leader);
  const leaderX = leader && all.find(x => x.p.id === leader.id);
  const bar = el("div", {class:"bar"}, Object.keys(CLASSES).filter(c => byCls[c]).map(c =>
    el("div", {style:`background:var(--${c});width:${100 * byCls[c] / g.size}%`, title:`${clsLabel(c)}: ${byCls[c]}`})));

  const head = el("div", {class:"colhead"},
    el("div", {class:"row"},
      el("span", {class:"ttl"}, g.name),
      el("button", {class:"icon editonly", title:"Rename / size", onclick: () => editGroup(g)}, "✎"),
      el("span", {class:"spacer"}),
      el("span", {class:"small", title:"In raid / max size, plus bench"}, `${active.length}/${g.size}` + (benched.length ? ` · ${benched.length} bench` : "")),
      el("button", {class:"icon", title:"Copy roster as text (for Discord)", onclick: () => copyGroup(g)}, "⧉")),
    el("div", {class:"leader"}, el("span", {class:"crown"}, "♛ "), "Raid leader: ",
      leader ? el("b", {style:`color:var(--${leaderX ? leaderX.c.cls : "Priest"})`}, leader.name)
             : el("span", {class:"small"}, "not set — click ♛ on a member")),
    el("div", {class:"counts"},
      el("span", {style:"color:var(--tank)"}, "Tanks ", el("b", {}, String(counts.tank))),
      el("span", {style:"color:var(--heal)"}, "Healers ", el("b", {}, String(counts.heal))),
      el("span", {style:"color:var(--dps)"}, "DPS ", el("b", {}, String(counts.dps))),
      counts.unknown ? el("span", {style:"color:var(--Unknown)"}, "? ", el("b", {}, String(counts.unknown))) : null),
    bar,
    el("div", {class:"clsgrid"}, Object.keys(CLASSES).filter(c => c !== "Unknown" || byCls[c]).map(c =>
      el("span", {style: byCls[c] ? "" : "opacity:.4"}, el("b", {style:`color:var(--${c})`}, clsLabel(c)), " " + (byCls[c] || 0)))),
    renderBuffs(g, active));

  const body = el("div", {class:"colbody"});
  if (!active.length) body.append(el("div", {class:"empty"}, "Drag players here, or use the 1 / 2 / 3 buttons in the list."));
  const byClsName = (a, b) => a.c.cls.localeCompare(b.c.cls) || a.p.name.localeCompare(b.p.name);
  for (const role of ROLES) {
    const rs = active.filter(x => roleOf(x.c.cls, x.s.spec) === role).sort(byClsName);
    if (!rs.length) continue;
    body.append(el("div", {class:"rolehead"}, `${ROLE_LABEL[role]} (${rs.length})`));
    for (const x of rs) body.append(renderSlot(g, x, perPlayer[x.p.id] > 1));
  }
  // Bench / rotation: in the group but not in the raid; not counted in size, roles or buffs
  body.append(el("div", {class:"benchzone"},
    el("div", {class:"rolehead"}, `Bench / rotation (${benched.length})`),
    benched.length ? benched.sort(byClsName).map(x => renderSlot(g, x, perPlayer[x.p.id] > 1))
                   : el("div", {class:"small benchhint"}, "Drag players here for bench / rotation")));
  if (all.length) body.append(el("div", {style:"text-align:center;margin-top:12px"},
    el("button", {class:"danger", onclick: async () => {
      if (await askConfirm(`Clear ${g.name}?`,
          `This removes all ${all.length} players (raid and bench) from ${g.name} and unsets its raid leader. They go back to the Players list.`,
          "Clear group")) op({op:"clearGroup", gid:g.id});
    }}, "Clear group")));

  const col = el("section", {class:"col grp", "data-drop": g.id}, head, body);
  wireDrop(col);
  return col;
}

function renderSlot(g, {s, p, c}, dup) {
  const isLeader = g.leader === p.id;
  // Class + spec this player brings to this raid: any class/spec; ★ = listed on the player's profile
  const known = (cls, sp) => p.chars.some(x => x.cls === cls && x.specs.includes(sp));
  const spec = el("select", {class:"specsel", title:"Class / spec for this raid (★ = on the player's profile)", onchange: e => {
        e.target.blur(); const [cls, sp] = e.target.value.split("|"); op({op:"setSpec", sid:s.id, cls, spec:sp}); }},
      Object.keys(CLASSES).map(cls => el("optgroup", {label: cls === "Unknown" ? "? Class unknown" : cls},
        CLASSES[cls].map(sp => el("option", {value:cls + "|" + sp, selected: cls === c.cls && sp === s.spec},
          (known(cls, sp) ? "★ " : "") + (cls === "Unknown" ? "?" : cls === c.cls ? sp : `${sp} ${cls}`))))));
  return el("div", {class:"slot" + (isLeader ? " isleader" : "") + (s.bench ? " benched" : ""), draggable:"true",
      title: p.note || "", ondragstart: e => dragData(e, {t:"slot", sid:s.id})},
    el("button", {class:"icon crownbtn" + (isLeader ? " on" : ""), title: isLeader ? "Unset raid leader" : "Make raid leader",
      onclick: () => op({op:"setLeader", gid:g.id, pid: isLeader ? null : p.id})}, "♛"),
    el("span", {class:"role " + roleOf(c.cls, s.spec)}),
    classIcon(c.cls), specIcon(c.cls, s.spec),
    el("span", {class:"name", style:`color:var(--${c.cls})`}, p.name),
    c.kind === "alt" ? el("span", {class:"badge alt"}, "alt") : null,
    dup ? el("span", {class:"badge warn", title:"This player has more than one character in this group"}, "2×") : null,
    el("span", {class:"spacer"}),
    spec,
    el("button", {class:"icon", title: s.bench ? "Move into the raid" : "Move to bench / rotation",
      onclick: () => op({op:"move", sid:s.id, gid:g.id, bench: !s.bench})}, s.bench ? "⇡" : "⇣"),
    el("button", {class:"icon", title:"Remove from group", onclick: () => op({op:"unassign", sid:s.id})}, "✕"));
}

function wireDrop(col) {
  const zoneOf = e => e.target.closest && e.target.closest(".benchzone");
  col.addEventListener("dragover", e => {
    e.preventDefault(); col.classList.add("drop");
    col.querySelectorAll(".benchzone").forEach(z => z.classList.toggle("drop", z === zoneOf(e)));
  });
  col.addEventListener("dragleave", e => {
    if (!col.contains(e.relatedTarget)) { col.classList.remove("drop"); col.querySelectorAll(".benchzone.drop").forEach(z => z.classList.remove("drop")); }
  });
  col.addEventListener("drop", e => {
    e.preventDefault(); col.classList.remove("drop");
    const bench = !!zoneOf(e);
    let d; try { d = JSON.parse(e.dataTransfer.getData("text/plain")); } catch(_) { return; }
    const target = col.dataset.drop;
    if (target === "bench") { if (d.t === "slot") op({op:"unassign", sid:d.sid}); return; }
    if (d.t === "char") op({op:"assign", pid:d.pid, cid:d.cid, gid:target, bench});
    else if (d.t === "slot") op({op:"move", sid:d.sid, gid:target, bench});
  });
}
wireDrop($("#bench"));

function copyGroup(g) {
  const all = g.slots.map(s => { const p = player(s.pid); return {s, p, c: charOf(p, s.cid)}; }).filter(x => x.p && x.c);
  const label = x => x.c.cls === "Unknown" ? `${x.p.name} (?)` : `${x.p.name} (${SHORT[x.s.spec] || x.s.spec} ${x.c.cls})`;
  const sorted = xs => xs.sort((a,b) => a.c.cls.localeCompare(b.c.cls) || a.p.name.localeCompare(b.p.name));
  const active = all.filter(x => !x.s.bench), benched = all.filter(x => x.s.bench);
  const lines = [`**${g.name}** (${active.length}/${g.size})` + (g.leader && player(g.leader) ? ` — Raid leader: ${player(g.leader).name}` : "")];
  for (const role of ROLES) {
    const rs = sorted(active.filter(x => roleOf(x.c.cls, x.s.spec) === role));
    if (rs.length) lines.push(`${ROLE_LABEL[role]} (${rs.length}): ` + rs.map(label).join(", "));
  }
  if (benched.length) lines.push(`Bench / rotation (${benched.length}): ` + sorted(benched).map(label).join(", "));
  const text = lines.join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(() => toast("Copied " + g.name + " to clipboard", true))
    .catch(() => prompt("Copy this:", text));
}

async function editGroup(g) {
  const name = prompt("Group name:", g.name); if (name == null) return;
  const size = prompt("Max size (1-40):", g.size); if (size == null) return;
  await op({op:"updateGroup", gid:g.id, name, size:Number(size)});
}

// ---------- player dialog ----------
let editing = null; // {pid|null, chars:[...]}
function openPlayer(p) {
  editing = {pid: p ? p.id : null, chars: p ? p.chars.map(c => ({...c, specs:[...c.specs]})) : [{cls:"Warrior", specs:[], kind:"main"}]};
  $("#playerDlgTitle").textContent = p ? "Edit player" : "Add player";
  $("#pName").value = p ? p.name : "";
  $("#pNote").value = p ? (p.note || "") : "";
  $("#deletePlayerBtn").style.display = p ? "" : "none";
  renderChars();
  $("#playerDlg").showModal();
  $("#pName").focus();
}
function renderChars() {
  const box = $("#pChars"); box.replaceChildren();
  editing.chars.forEach((c, i) => {
    const used = new Set(editing.chars.filter((_, j) => j !== i).map(x => x.cls));
    box.append(el("div", {class:"charrow"},
      el("div", {class:"row"},
        el("select", {onchange: e => { c.cls = e.target.value; c.specs = CLASSES[c.cls].length === 1 ? [...CLASSES[c.cls]] : []; delete c.id; renderChars(); }},
          Object.keys(CLASSES).filter(k => k === c.cls || !used.has(k)).map(k => el("option", {value:k, selected:k === c.cls}, k === "Unknown" ? "? (class unknown)" : k))),
        el("select", {onchange: e => c.kind = e.target.value},
          el("option", {value:"main", selected:c.kind === "main"}, "Main"),
          el("option", {value:"alt", selected:c.kind === "alt"}, "Alt")),
        el("span", {class:"spacer"}),
        el("button", {type:"button", class:"icon", title:"Remove this class", onclick: () => { editing.chars.splice(i, 1); renderChars(); }}, "✕")),
      el("div", {class:"spectoggles"}, CLASSES[c.cls].map(sp => {
        const idx = c.specs.indexOf(sp);
        return el("button", {type:"button", class: idx >= 0 ? "on" : "", onclick: () => {
          idx >= 0 ? c.specs.splice(idx, 1) : c.specs.push(sp); renderChars(); }},
          (idx >= 0 ? (idx + 1) + ". " : "") + specLabel(sp));
      }))));
  });
  $("#addCharBtn").style.display = editing.chars.length >= Object.keys(CLASSES).length ? "none" : "";
}
$("#addCharBtn").onclick = () => {
  const used = new Set(editing.chars.map(c => c.cls));
  const cls = Object.keys(CLASSES).find(k => !used.has(k));
  editing.chars.push({cls, specs:[], kind: editing.chars.length ? "alt" : "main"}); renderChars();
};
$("#playerForm").onsubmit = async e => {
  e.preventDefault();
  const body = {name: $("#pName").value, note: $("#pNote").value, chars: editing.chars};
  const ok = await op(editing.pid ? {op:"updatePlayer", pid:editing.pid, ...body} : {op:"addPlayer", ...body});
  if (ok) closeDlg("#playerDlg");
};
$("#cancelPlayerBtn").onclick = () => closeDlg("#playerDlg");
$("#deletePlayerBtn").onclick = async () => {
  const p = player(editing.pid);
  if (p && await askConfirm(`Delete ${p.name}?`, `This deletes ${p.name} and all their classes, and removes them from every raid.`, "Delete player") && await op({op:"deletePlayer", pid:p.id})) closeDlg("#playerDlg");
};
function closeDlg(sel) { $(sel).close(); }
// Styled confirmation; resolves true only when the red button is clicked
function askConfirm(title, msg, okLabel) {
  const d = $("#confirmDlg");
  $("#confirmTitle").textContent = title; $("#confirmMsg").textContent = msg; $("#confirmOk").textContent = okLabel;
  d.returnValue = "";
  d.showModal();
  return new Promise(res => d.addEventListener("close", () => res(d.returnValue === "ok"), {once:true}));
}
document.querySelectorAll("dialog").forEach(d => d.addEventListener("close", () => requestRender()));
$("#addPlayerBtn").onclick = () => openPlayer(null);

// ---------- filters ----------
$("#search").oninput = e => { filt.q = e.target.value; renderBench(); };
$("#clsFilter").onchange = e => { filt.cls = e.target.value; renderBench(); };
$("#hidePlaced").onchange = e => { filt.hidePlaced = e.target.checked; renderBench(); };
document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => {
  filt.kind = b.dataset.kind;
  document.querySelectorAll("[data-kind]").forEach(x => x.classList.toggle("on", x === b));
  renderBench();
});

// ---------- boot ----------
startSync();
</script>
